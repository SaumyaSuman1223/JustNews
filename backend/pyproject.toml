[project]
name = "justnews-api"
version = "0.1.0"
description = "JustNews HTTP API"
requires-python = ">=3.12"
dependencies = [
    "justnews-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    # JWT verification against Supabase's JWKS (RS256/ES256). Replaces
    # nothing - Stage 1 had no auth. python-jose was the alternative; PyJWT
    # has a smaller dependency footprint and the same JWK support.
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
]

[project.scripts]
justnews-api = "justnews_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# py.typed ships the inline annotations, so downstream mypy sees real types
# instead of falling back to Any at every package boundary.
[tool.hatch.build.targets.wheel]
packages = ["src/justnews_api"]

[tool.uv.sources]
justnews-core = { workspace = true }
