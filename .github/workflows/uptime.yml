name: uptime

# A monitor for exactly two things the ingestion cron cannot tell you about:
# the API process, and the deployed web app. ingest.yml already fails loudly
# whenever Supabase itself is unreachable (it's on the request path of every
# ingestion run), so this workflow's whole marginal value is the two things
# that cron never touches.
on:
  schedule:
    # Offset from the hour/quarter-hour marks - see ingest.yml's comment on
    # why "*/15 * * * *" itself is the wrong shape to ask GitHub for.
    #
    # Every 10 minutes, not 15: this is also what keeps the free API awake.
    # Render sleeps it after 15 idle minutes, and GitHub routinely runs a
    # scheduled job several minutes late - a 15-minute ping lost that race
    # often enough that readers met 30-50s cold starts (ADR 0014).
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ secrets.STAGING_API_URL }}
      # A variable, but read from a secret of the same name too: it is not
      # sensitive, and saving it under the Secrets tab instead of Variables
      # is an easy slip that left it empty - curl then fails with "No host
      # part in the URL", which reads like an outage.
      SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
    steps:
      - name: Settings are set
        # Without this, a missing setting fails the first curl that uses it,
        # indistinguishable at a glance from the service being down.
        run: |
          missing=0
          if [ -z "$API_URL" ]; then
            echo "::error::STAGING_API_URL is not set: Settings > Secrets and variables > Actions > Secrets"
            missing=1
          fi
          if [ -z "$SITE_URL" ]; then
            echo "::error::SITE_URL is not set: Settings > Secrets and variables > Actions > Variables"
            missing=1
          fi
          exit $missing

      - name: API liveness (/health)
        # No -f: the point is to parse the body and report *why* it failed,
        # not just that curl saw a non-2xx. A non-JSON or connection-level
        # failure makes `status` empty, which the check below catches the
        # same way a real {"status": "..."} mismatch would.
        #
        # --max-time 60 --retry 3, not a short timeout: Render's free tier
        # cold-starts in roughly 22s after 15 minutes idle (see the comment
        # in frontend/lib/api.ts), and this cron runs every 15 minutes - a
        # short timeout here would page on ordinary idle-then-wake, not on a
        # real outage.
        run: |
          curl -sS --max-time 60 --retry 3 --retry-all-errors --retry-delay 10 \
            "${API_URL%/}/health" -o response.json || true
          status=$(jq -r '.status // empty' response.json 2>/dev/null)
          if [ "$status" != "ok" ]; then
            echo "::error::/health did not return status=ok (got: ${status:-<unreadable>})"
            cat response.json 2>/dev/null || true
            exit 1
          fi

      - name: API readiness (/health/ready)
        # A separate step, not folded into the one above: a 503 here means
        # the database specifically is unreachable, which the runbook entry
        # for this workflow should be able to tell apart from the process
        # itself being down.
        run: |
          curl -sS --max-time 60 --retry 3 --retry-all-errors --retry-delay 10 \
            "${API_URL%/}/health/ready" -o response.json || true
          status=$(jq -r '.status // empty' response.json 2>/dev/null)
          if [ "$status" != "ready" ]; then
            echo "::error::/health/ready did not return status=ready (got: ${status:-<unreadable>})"
            cat response.json 2>/dev/null || true
            exit 1
          fi

      - name: Web app
        run: |
          curl -fsS --max-time 60 --retry 3 --retry-all-errors --retry-delay 10 \
            "${SITE_URL%/}/en" -o /dev/null
