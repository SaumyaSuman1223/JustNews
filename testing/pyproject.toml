[project]
name = "justnews-testing"
version = "0.1.0"
description = "Shared pytest fixtures and factories"
requires-python = ">=3.12"
dependencies = ["justnews-core", "justnews-api", "pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/justnews_testing"]

[tool.uv.sources]
justnews-core = { workspace = true }
justnews-api = { workspace = true }
