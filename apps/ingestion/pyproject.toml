[project]
name = "justnews-ingestion"
version = "0.1.0"
description = "RSS, GNews and metadata ingestion for JustNews"
requires-python = ">=3.12"
dependencies = [
    "justnews-core",
    "httpx>=0.28",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "py3langid>=0.3",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.3"]

[project.scripts]
justnews-ingest = "justnews_ingestion.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/justnews_ingestion"]

[tool.uv.sources]
justnews-core = { workspace = true }
