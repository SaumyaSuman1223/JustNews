[project]
name = "justnews-ingestion"
version = "0.1.0"
description = "RSS, GNews and metadata ingestion for JustNews"
requires-python = ">=3.12"
dependencies = [
    "justnews-core",
    "httpx>=0.28",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "py3langid>=0.3",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.3"]
# `user-vectors` runs the exported FINDING user tower (ADR 0016). Replaces
# nothing; removing it removes that one command.
finding = ["onnxruntime>=1.20"]

[project.scripts]
justnews-ingest = "justnews_ingestion.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# py.typed ships the inline annotations, so downstream mypy sees real types
# instead of falling back to Any at every package boundary.
[tool.hatch.build.targets.wheel]
packages = ["src/justnews_ingestion"]

[tool.uv.sources]
justnews-core = { workspace = true }
