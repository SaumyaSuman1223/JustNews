[project]
name = "justnews-api"
version = "0.1.0"
description = "JustNews HTTP API"
requires-python = ">=3.12"
dependencies = [
    "justnews-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
]

[project.scripts]
justnews-api = "justnews_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/justnews_api"]

[tool.uv.sources]
justnews-core = { workspace = true }
